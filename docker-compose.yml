services:
  postgres:
    image: postgres:16-alpine
    container_name: stoprotas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stoprotas}
      POSTGRES_USER: ${POSTGRES_USER:-stoprotas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stoprotas}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stoprotas}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: stoprotas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-stoprotas}:${POSTGRES_PASSWORD:-stoprotas}@postgres:5432/${POSTGRES_DB:-stoprotas}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      JWT_EXPIRES: 7d
    ports:
      - "4000:4000"

  adminer:
    image: adminer:latest
    container_name: stoprotas-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
