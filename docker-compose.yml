services:
  mysql:
    image: mysql:8.0
    container_name: stoprotas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-stoprotas}
      MYSQL_USER: ${MYSQL_USER:-stoprotas}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stoprotas}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: stoprotas-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-stoprotas}
      DB_PASSWORD: ${MYSQL_PASSWORD:-stoprotas}
      DB_NAME: ${MYSQL_DATABASE:-stoprotas}
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      JWT_EXPIRES: 7d
    ports:
      - "4000:4000"

  adminer:
    image: adminer:latest
    container_name: stoprotas-adminer
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8080:8080"

volumes:
  mysql_data:
